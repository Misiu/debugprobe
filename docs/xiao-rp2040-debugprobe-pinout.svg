<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700">
  <rect width="1100" height="700" fill="#ffffff"/>
  <style>
    .title{font:700 34px Arial,sans-serif;fill:#111}
    .sub{font:400 18px Arial,sans-serif;fill:#444}
    .pin{font:700 20px Arial,sans-serif;fill:#111}
    .func{font:700 20px Arial,sans-serif;fill:#111}
    .small{font:400 16px Arial,sans-serif;fill:#333}
    .board{fill:#f4f4f4;stroke:#222;stroke-width:3}
    .pad{fill:#d9d9d9;stroke:#555;stroke-width:2}
    .active{fill:#fff4b3;stroke:#111;stroke-width:3}
    .power{fill:#dff7df;stroke:#111;stroke-width:3}
    .warn{fill:#ffe5e5;stroke:#a00;stroke-width:2}
    .line{stroke:#111;stroke-width:3;fill:none;marker-end:url(#arrow)}
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#111"/>
    </marker>
  </defs>

  <text x="50" y="55" class="title">Seeed Studio XIAO RP2040 - Debug Probe wiring</text>
  <text x="50" y="85" class="sub">Pin names follow Seeed Studio's official XIAO RP2040 naming.</text>

  <!-- board -->
  <rect x="355" y="120" rx="26" ry="26" width="390" height="500" class="board"/>
  <rect x="475" y="105" rx="12" ry="12" width="150" height="48" fill="#c9c9c9" stroke="#555" stroke-width="2"/>
  <text x="512" y="136" class="small">USB-C</text>
  <rect x="425" y="200" rx="16" ry="16" width="250" height="250" fill="#e9ecef" stroke="#777" stroke-width="2"/>
  <text x="492" y="300" class="pin">XIAO</text>
  <text x="463" y="335" class="pin">RP2040</text>

  <!-- left pins -->
  <g>
    <rect x="330" y="185" width="55" height="34" class="pad"/><text x="280" y="209" class="pin">D0</text>
    <rect x="330" y="235" width="55" height="34" class="pad"/><text x="280" y="259" class="pin">D1</text>
    <rect x="330" y="285" width="55" height="34" class="pad"/><text x="280" y="309" class="pin">D2</text>
    <rect x="330" y="335" width="55" height="34" class="pad"/><text x="280" y="359" class="pin">D3</text>
    <rect x="330" y="385" width="55" height="34" class="pad"/><text x="280" y="409" class="pin">D4</text>
    <rect x="330" y="435" width="55" height="34" class="pad"/><text x="280" y="459" class="pin">D5</text>
    <rect x="330" y="485" width="55" height="34" class="pad"/><text x="280" y="509" class="pin">D6</text>
  </g>

  <!-- right pins, same order as official front pinout -->
  <g>
    <rect x="715" y="185" width="55" height="34" class="pad"/><text x="790" y="209" class="pin">5V</text>
    <rect x="715" y="235" width="55" height="34" class="power"/><text x="790" y="259" class="pin">GND</text>
    <rect x="715" y="285" width="55" height="34" class="power"/><text x="790" y="309" class="pin">3V3</text>
    <rect x="715" y="335" width="55" height="34" class="active"/><text x="790" y="359" class="pin">D10</text>
    <rect x="715" y="385" width="55" height="34" class="pad"/><text x="790" y="409" class="pin">D9</text>
    <rect x="715" y="435" width="55" height="34" class="active"/><text x="790" y="459" class="pin">D8</text>
    <rect x="715" y="485" width="55" height="34" class="active"/><text x="790" y="509" class="pin">D7</text>
  </g>

  <!-- callouts -->
  <path d="M770 352 C900 352 900 220 1010 220" class="line"/>
  <text x="860" y="205" class="func">D10 / GPIO3 -> SWDIO</text>

  <path d="M770 452 C920 452 920 335 1010 335" class="line"/>
  <text x="860" y="320" class="func">D8 / GPIO2 -> SWCLK</text>

  <path d="M770 502 C920 502 920 450 1010 450" class="line"/>
  <text x="860" y="435" class="func">D7 / GPIO1 -> nRESET</text>

  <path d="M715 252 C635 252 635 545 535 545" class="line"/>
  <text x="70" y="565" class="func">GND -> target GND</text>

  <path d="M715 302 C650 302 650 590 535 590" class="line"/>
  <text x="70" y="610" class="func">3V3 -> target VCC 3.3 V</text>

  <rect x="65" y="630" width="970" height="48" rx="8" class="warn"/>
  <text x="90" y="661" class="func">Safety: target logic is 3.3 V. Do not connect the target to the XIAO 5V pin.</text>

  <text x="50" y="108" class="small">Official Seeed Studio front-pinout reference: https://files.seeedstudio.com/wiki/XIAO-RP2040/img/XIAO_RP2040_front_pinout.png</text>
</svg>
