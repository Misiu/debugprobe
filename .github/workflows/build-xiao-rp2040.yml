name: Build XIAO RP2040 Debug Probe

on:
  push:
    branches:
      - xiao-rp2040-reset
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout debugprobe
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi

      - name: Checkout Pico SDK
        uses: actions/checkout@v4
        with:
          repository: raspberrypi/pico-sdk
          ref: 2.2.0
          path: pico-sdk
          submodules: recursive

      - name: Configure
        env:
          PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
        run: |
          cmake -S . -B build -G Ninja -DDEBUG_ON_PICO=ON -DPICO_BOARD=pico

      - name: Build
        run: cmake --build build --target debugprobe

      - name: Show generated files
        run: ls -lh build/debugprobe_on_xiao_rp2040.*

      - name: Upload UF2
        uses: actions/upload-artifact@v4
        with:
          name: debugprobe-xiao-rp2040
          path: build/debugprobe_on_xiao_rp2040.uf2
          if-no-files-found: error
